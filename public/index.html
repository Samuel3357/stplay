<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ST PLAY</title><meta name="description" content="Adicione sua lista ao ST PLAY na TV."><meta name="theme-color" content="#050109">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"></head>
<body><main>
<div class="top">
  <span class="brand"><img src="/favicon.png" alt="" width="40" height="40">ST <b>PLAY</b></span>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="pt" aria-pressed="true">PT</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
</div>
<section class="hero">
  <img src="/logo.png" alt="ST PLAY" width="210" height="210">
  <h1 data-i18n="title"></h1>
  <p class="mut" data-i18n="sub"></p>
</section>

<div class="tabs" role="tablist">
  <button type="button" role="tab" id="tab-add" aria-selected="true" data-i18n="tabAdd"></button>
  <button type="button" role="tab" id="tab-mine" aria-selected="false" data-i18n="tabMine"></button>
</div>

<form id="f" class="card" autocomplete="off">
  <label for="code" data-i18n="lCode"></label>
  <input id="code" class="code" maxlength="6" inputmode="text" autocapitalize="characters" required placeholder="ABC234">
  <label for="type" data-i18n="lType"></label>
  <select id="type"><option value="m3u">M3U / M3U8</option><option value="xtream">Xtream Codes</option></select>
  <label for="name" data-i18n="lName"></label>
  <input id="name" maxlength="40" data-i18n-ph="phName">
  <div id="g-m3u"><label for="url" data-i18n="lUrl"></label><input id="url" type="url" placeholder="http://…/lista.m3u"></div>
  <div id="g-x" hidden>
    <label for="server" data-i18n="lServer"></label><input id="server" type="url" placeholder="http://server:port">
    <label for="user" data-i18n="lUser"></label><input id="user" autocomplete="off">
    <label for="pass" data-i18n="lPass"></label><input id="pass" type="password" autocomplete="off">
  </div>
  <button id="go" class="go" type="submit" data-i18n="send"></button>
  <div id="msg" class="msg" role="status"></div>
  <p class="note" data-i18n="note"></p>
</form>

<section id="mine" class="card" hidden>
  <label for="code2" data-i18n="lCode"></label>
  <input id="code2" class="code" maxlength="6" autocapitalize="characters" placeholder="ABC234">
  <button id="look" class="go" type="button" data-i18n="look"></button>
  <div id="msg2" class="msg" role="status"></div>
  <div id="info" hidden>
    <h2 data-i18n="saved"></h2>
    <dl class="kv"><dt data-i18n="kName"></dt><dd id="i-name"></dd><dt data-i18n="kType"></dt><dd id="i-type"></dd><dt data-i18n="kHost"></dt><dd id="i-host"></dd></dl>
    <button id="del" class="go ghost" type="button" data-i18n="remove"></button>
    <p class="note" data-i18n="replaceNote"></p>
  </div>
</section>

<h2 data-i18n="howTitle"></h2>
<ol class="steps">
  <li><i>1</i><span data-i18n="s1"></span></li>
  <li><i>2</i><span data-i18n="s2"></span></li>
  <li><i>3</i><span data-i18n="s3"></span></li>
</ol>
<h2 data-i18n="privTitle"></h2>
<p class="mut" data-i18n="privText"></p>
<footer><span id="legal"></span><br><span>© SamTech</span></footer>
</main><script src="/app.js"></script></body></html>
