<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ST PLAY — Adicionar lista</title><link rel="stylesheet" href="/style.css"><meta name="robots" content="noindex"></head>
<body><main>
<div class="brand">ST <b>PLAY</b></div>
<h1 id="t-title">Adicionar lista à sua TV</h1>
<p class="mut" id="t-sub">Digite o código que aparece na tela da TV e informe a sua lista.</p>
<form id="f" class="card" autocomplete="off">
  <label for="code" id="l-code">Código da TV</label>
  <input id="code" class="code" maxlength="6" inputmode="text" autocapitalize="characters" required placeholder="ABC234">
  <label for="type" id="l-type">Tipo de lista</label>
  <select id="type"><option value="m3u">M3U / M3U8 (link)</option><option value="xtream">Xtream Codes</option></select>
  <label for="name" id="l-name">Nome (opcional)</label>
  <input id="name" maxlength="40" placeholder="Minha lista">
  <div id="g-m3u"><label for="url" id="l-url">Link da lista</label><input id="url" type="url" placeholder="http://…/lista.m3u"></div>
  <div id="g-x" hidden>
    <label for="server" id="l-server">Servidor</label><input id="server" type="url" placeholder="http://servidor:porta">
    <label for="user" id="l-user">Usuário</label><input id="user" autocomplete="off">
    <label for="pass" id="l-pass">Senha</label><input id="pass" type="password" autocomplete="off">
  </div>
  <button id="go" type="submit">Enviar para a TV</button>
  <div id="msg" class="msg" role="status"></div>
  <p class="note" id="t-note">Adicione apenas conteúdo que você tem direito de acessar. A lista é entregue à TV uma única vez e apagada do servidor.</p>
</form>
<footer><a href="/termos.html">Termos de Uso</a> · <a href="/privacidade.html">Privacidade</a> · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></footer>
</main><script src="/app.js"></script></body></html>
